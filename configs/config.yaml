models:
  primary: llama3.2:latest
  embedding: nomic-embed-text:latest
  ollama_url: http://localhost:11434

identity:
  soul_path: data/soul
  constitution_path: data/constitution

memory:
  chroma_db_path: data/chroma_db
  retrieval:
    top_k_episodic: 5
    top_k_knowledge: 5
  candidate_cleanup_days: 30

governance:
  llm_timeout: 60
  temperature: 0.0

context:
  default_budget: 2000

promotion:
  threshold: 0.65
  min_cluster_size: 3
  supersession_threshold: 0.85

llm:
  default_timeout: 120
  temperature: 0.7

session:
  timeout_minutes: 30
  allow_manual_end: true
  allow_keep_alive: true

pipeline:
  inline_execution: false
  triggers:
    session_end: true
    eligible_memory_threshold: 25
    manual_trigger: true
    startup_recovery: true

retrieval:
  soul:
    unavailable: halt
  memory:
    unavailable: degrade_gracefully
  knowledge:
    unavailable: degrade_gracefully

