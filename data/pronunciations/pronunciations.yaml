# data/pronunciations/pronunciations.yaml
#
# SAGE's personal pronunciation dictionary.
#
# Each entry maps a written form (as it appears in SAGE's speech) to its
# correct pronunciation. Three entry formats are supported:
#
#   1. Native-script (recommended, most authentic):
#        Sanatana: { script: "सनातन", lang: hi }
#      SAGE phonemizes the native spelling in that language and speaks the
#      word with its authentic pronunciation.
#
#   2. Direct phonemes (power users only):
#        Sanatana: { phonemes: "sənˈaːtən" }
#      Phonemes must use the espeak-ng symbol set that Kokoro understands.
#
#   3. Simple respelling (plain text substitution):
#        Herr: { spoken: "hair" }
#      The spoken form is substituted into the text before synthesis. Simple
#      and safe, but less precise than native-script phonemization.
#
# Languages supported by this machine's espeak build include:
#   hi mr bn gu kn ml pa te ta ur ne si  (Indian)
#   it de es ja ko ru pt nl pl tr el    (others)

pronunciations:

  # ── Sanskrit / Hindi (spoken via Hindi phonemizer for authentic sound) ──
  # Multiple Romanized spellings map to the same native script so the
  # pronunciation is authentic no matter how the word is transliterated.
  Sanatana:
    script: "सनातन"
    lang: hi
  Sanathana:
    script: "सनातन"
    lang: hi
  Sanatan:
    script: "सनातन"
    lang: hi
  Sanathan:
    script: "सनातन"
    lang: hi
