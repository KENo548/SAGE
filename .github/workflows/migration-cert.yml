name: Migration Certification

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai-whisper==20250625 numpy chromadb==1.5.9 PyYAML requests sounddevice pytest

      - name: Run migration certification
        run: |
          python scripts/certify_migration.py
